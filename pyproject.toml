[project]
name = "greg"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Fenix085", email = "vladimirhurtovyi@gmail.com" }
]
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
planner = [
    "numpy>=2",
    "pandas>=2.2,<3",
    "h5py>=3.12",
    "statsforecast>=2.1",
]

[dependency-groups]
dev = [
    "greg[planner]",
]

[project.scripts]
greg = "greg:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
