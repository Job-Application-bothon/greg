apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: greg
  labels:
    app: greg
  annotations:
    haproxy.router.openshift.io/timeout: 120s
spec:
  to:
    kind: Service
    name: greg
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
