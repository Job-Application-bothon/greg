apiVersion: apps/v1
kind: Deployment
metadata:
  name: greg
  labels:
    app: greg
spec:
  replicas: 1
  selector:
    matchLabels:
      app: greg
  template:
    metadata:
      labels:
        app: greg
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: greg
          image: ghcr.io/job-application-bothon/greg:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: greg-config
                optional: true
            - secretRef:
                name: greg-llm-secret
                optional: true
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
